name: Refresh satellite orbit data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/satellite-data.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: satellite-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CelesTrak OMM and TLE
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, time, urllib.request
          root=pathlib.Path("data"); root.mkdir(exist_ok=True)
          groups=["stations","weather","resource","science","visual"]
          ok=0
          for group in groups:
              for fmt,ext in (("JSON","json"),("TLE","tle")):
                  url=f"https://celestrak.org/NORAD/elements/gp.php?GROUP={group}&FORMAT={fmt}"
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"EarthObservatory/1.0 (GitHub Pages satellite data refresh)","Accept":"application/json,text/plain,*/*"})
                      with urllib.request.urlopen(req,timeout=35) as response:
                          raw=response.read()
                      if fmt=="JSON":
                          value=json.loads(raw)
                          if not isinstance(value,list) or not value: raise ValueError("Empty OMM list")
                      else:
                          if b"1 " not in raw or b"2 " not in raw: raise ValueError("Invalid TLE")
                      (root/f"{group}.{ext}").write_bytes(raw)
                      ok+=1
                      print(f"Saved {group}.{ext}: {len(raw)} bytes")
                  except Exception as exc:
                      print(f"WARNING {group}.{ext}: {exc}")
                  time.sleep(1)
          if not any(root.glob("*.json")) or not any(root.glob("*.tle")):
              raise SystemExit("No usable OMM and TLE data")
          print(f"Successful downloads: {ok}/10")
          PY
      - name: Commit refreshed orbit data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public satellite orbit data"
            git push
          fi
